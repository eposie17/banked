function clearField(){R.chunks.length=0;R.enemies.length=0;R.pending.length=0;R.minis.length=0;R.pickups.length=0;R.dq.length=0;R.bolts.length=0;R.kegs.length=0;R.fx={};R.tilt=null;R.twin.b=null;R.ball.hits.clear();
 R.shots.length=0;R.marks.length=0;R.slime.length=0;R.patches.length=0;R.booms.length=0;R.stomps.length=0;R.mags=[];R.ball.leech=null;
 let i=0;for(const k in R.pu){R.pu[k].t=2.5+1.5*i;i++;}}

// ================= saving a run =================
// A run is saved at every card screen (kind 'gate') and at the start of every wave and the boss (kind 'wave'). If the app is
// closed, CONTINUE on the title brings back the card screen, or starts the interrupted wave again. QUIT keeps the save too.
// Practice runs are never saved. The save goes when the run ends.
const RUN_KEYS=['gt','wave','waveN','score','hearts','maxH','upg','reroll','banishes','locks','banned','locked','lockedShown','heat','level','nextLvl','lvlDue','freeDue',
 'picksOwed','pickN','gateLvl','rewards','bestChain','totalKills','lost','flicks','heavyN','fullN','picks','plan','si','bossesBeaten','clearTitle','met','first','pu','puSeen','grabs','offer','gateN','daily'];
function saveRun(kind){if(!R||R.practice)return;const o={v:1,kind,rs,twinN:R.twin.n};for(const k of RUN_KEYS)o[k]=R[k];SAVED=JSON.parse(JSON.stringify(o));try{localStorage.setItem('banked9.run',JSON.stringify(o));}catch(e){}}
function keepHurt(){if(!R||R.practice||!SAVED||SAVED.kind!=='wave'||R.hearts>=SAVED.hearts||R.hearts<1)return;SAVED.hearts=R.hearts;try{localStorage.setItem('banked9.run',JSON.stringify(SAVED));}catch(e){}}
function clearRun(){SAVED=null;try{localStorage.removeItem('banked9.run');}catch(e){}}
function runOk(o){if(!o||o.v!==1||!Array.isArray(o.plan)||typeof o.si!=='number'||o.si>=o.plan.length-(o.kind==='gate'?1:0)||(o.hearts|0)<1)return false;
 return o.plan.every(s=>s&&(s.k==='boss'?!!BOSSES[s.key]:(WAVES.some(w=>w.k===s.w)||!!(s.intro&&ETYPES[s.intro]))));}
function continueRun(){const o=SAVED;if(!o||!runOk(o)){clearRun();return;}audioInit();freshR(null);for(const k of RUN_KEYS)if(k in o)R[k]=o[k];R.twin.n=o.twinN|0;
 if(R.daily){rs=o.rs|0;rnd=seeded;}else rnd=Math.random;recalc();R.ball.shield=C.shieldMax;buffered=null;paused=false;R.sel=null;
 if(o.kind==='gate'){R.phase='gatewait';R.wv=null;scr='gate';scrT=0;gateAnim=0;if(!R.offer||!R.offer.length)R.offer=makeOffer([]);}
 else{scr='play';scrT=0;advance();R.spawnT=1.6;}}
// what the title says about a saved run: what comes next, and your hearts
function savedLabel(o){const n=o.si+1,s=o.plan[n],nw=o.plan.filter(q=>q.k==='wave').length;
 const w=!s?'':s.k==='boss'?'the boss':'wave '+o.plan.slice(0,n+1).filter(q=>q.k==='wave').length+' of '+nw;
 return (o.daily?'Daily run':'Saved run')+': '+(o.kind==='gate'?'cards, then ':'')+w+'  ·  ♥ '+o.hearts+'/'+o.maxH;}

// ================= run plan =================
// a run is 4 waves and a boss. The very first run is fixed: runners (full pull), tanks (short pull), Pairs, Lanes, then the Twin Kings.
// After that: an opening wave, the next new kind's intro wave (while any are left), two later waves (the last with Big enemies), and a boss.
const nextNew=()=>NEW_ORDER.find(k=>!META.seen.includes(k))||null;
const metKind=k=>k==='runner'||k==='tank'||META.seen.includes(k);
// a wave can come up once you have met the kind it needs
const waveOk=w=>!w.need||metKind(w.need);
const pickBoss=()=>pickR(BOSS_KEYS.filter(k=>k!==META.lastBoss));
function buildPlan(prac){
 if(!prac&&!META.tut)return [{k:'wave',w:'first1'},{k:'wave',w:'first2'},{k:'wave',w:'pairs'},{k:'wave',w:'lanes'},{k:'boss',key:'kings'}];
 const nk=prac||!META.newOk?null:nextNew(),introW=nk==='nest'?'hives':null;
 const t1=shuffleR(WAVES.filter(w=>w.tier===1&&waveOk(w))),t2=shuffleR(WAVES.filter(w=>w.tier===2&&waveOk(w)&&w.k!==introW));
 const plan=[{k:'wave',w:t1[0].k},nk?{k:'wave',w:introW,intro:nk}:{k:'wave',w:t1[1].k},{k:'wave',w:t2[0].k},{k:'wave',w:t2[1].k,big:true},{k:'boss',key:pickBoss()}];
 // GOLDEN: in about 4 runs of 10, one enemy in wave 3 or 4 is a runaway worth an extra pick
 if(rnd()<0.4)plan[rnd()<0.5?2:3].gold=true;
 return plan;}
// DAILY RUN: two early waves, two later waves (the last with Big enemies) and a boss, from every wave and enemy in the game.
// The same for everyone that day (seeded), at normal heat, with no new-enemy intro.
function dailyPlan(){const t1=shuffleR(WAVES.filter(w=>w.tier===1)),t2=shuffleR(WAVES.filter(w=>w.tier===2));
 const plan=[{k:'wave',w:t1[0].k},{k:'wave',w:t1[1].k},{k:'wave',w:t2[0].k},{k:'wave',w:t2[1].k,big:true},{k:'boss',key:pickR(BOSS_KEYS)}];
 if(rnd()<0.5)plan[rnd()<0.5?2:3].gold=true;return plan;}
// practice: one room on a loop, one boss, or a run with the chosen abilities
function practicePlan(p){
 if(p.kind==='enemy')return [{k:'wave',fixed:testWave(p),loop:true,guest:p.enemy}];
 if(p.kind==='wave'){const w=WAVES.find(w=>w.k===p.wave)||WAVES[2];return [{k:'wave',fixed:w,loop:true}];}
 if(p.kind==='boss')return [{k:'boss',key:p.boss}];
 return buildPlan(true);}
// a test room for one enemy kind: three squads of it (with the chosen twist and colour), plus tanks for the medic to heal
function testWave(p){const T=ETYPES[p.enemy]||ETYPES.runner,tw=p.twist?'+'+p.twist:'',col=p.col==='blue'?':b':p.col==='green'?':g':'';
 const n={swarm:6,nest:2,medic:2}[p.enemy]||3;
 const tok=i=>p.enemy+(T.ec==='e'?(col||(i%2?':b':':g')):'')+tw,sq=k=>Array.from({length:k},(_,i)=>tok(i)).join(' ');
 const extra=p.enemy==='medic'?' tank*3':'';
 if(p.enemy==='nest')return {k:'test',name:T.name,tier:1,rule:T.rule,desc:T.d,place:[{t:p.enemy,x:70,y:70,el:p.twist},{t:p.enemy,x:290,y:70,el:p.twist}],script:[{d:[2,3],c:'runner*3'},{d:[4,5],c:'runner tank runner'}]};
 return {k:'test',name:T.name,tier:1,rule:T.rule,desc:T.d,script:[{d:[0,1],c:sq(n)+extra},{d:[2,3],c:sq(n)},{d:[4,5],c:sq(n)+extra}]};}
// a new kind's intro wave, built from its INTRO line: three squads from three pairs of doors; either-colour kinds alternate green and blue
function introWave(k){const T=ETYPES[k],sqs=(INTRO[k]||k+'*3').split('|'),drs=[[0,1],[2,3],[4,5]];
 const col=c=>c.split(' ').map((t,i)=>{const m=t.match(/^(\w+)(\*(\d+))?$/);if(!m||m[1]!==k||T.ec!=='e')return t;const n=+(m[3]||1);return Array.from({length:n},(_,j)=>k+((i+j)%2?':b':':g')).join(' ');}).join(' ');
 return {k:'intro',name:'NEW: '+T.name,tier:1,rule:T.rule,desc:T.d,script:sqs.map((c,i)=>({d:drs[i%3],c:col(c)}))};}
// the wave's guest ('?'): one kind you have already met (not a nest, not one the wave rules out); before you have met any, a runner
function pickGuest(w){const ok=(R&&R.daily?NEW_ORDER:META.seen).filter(k=>k!=='nest'&&!(w&&w.noGuest&&w.noGuest.includes(k)));return ok.length?pickR(ok):'runner';}
const totalWaves=()=>R.plan.filter(s=>s.k==='wave').length;
const loopRoom=()=>!!(R.practice&&R.plan[R.si]&&R.plan[R.si].loop);
// a plan stage becomes a room: its wave, its guest, and whether it has Big or Golden enemies
function roomFor(s){const w=s.fixed||(s.w?WAVES.find(q=>q.k===s.w):introWave(s.intro));
 return {w,guest:s.guest||pickGuest(w),big:!!s.big||(!R.practice&&R.heat>=5),gold:!!s.gold,intro:s.intro||null};}
// the wave a plan stage will be, for the screen before it
const stageWave=s=>s.fixed||(s.w?WAVES.find(q=>q.k===s.w):introWave(s.intro));
// go to the next stage: a wave or the boss. After the last stage the run ends.
function advance(){
 if(loopRoom()){enterRoom(roomFor(R.plan[R.si]));return;}
 R.si++;
 if(R.si>=R.plan.length){finishRun();return;}
 const s=R.plan[R.si];reseed(100+R.si);
 if(s.k==='boss'){scr='play';scrT=0;startBoss(s.key);return;}
 enterRoom(roomFor(s));}
function enterRoom(o){scr='play';scrT=0;startWave(o);}

// ================= waves =================
function mkTok(type,ec,el){const T=ETYPES[type]||ETYPES.runner;let c=T.ec;if(c==='e')c=ec==='g'||ec==='b'?ec:(rnd()<0.5?'g':'b');return {type,ec:c,el:el||''};}
function parseToks(s){const out=[];for(const raw of s.split(' ')){if(!raw)continue;let t=raw,n=1,el='',ec='';const m=t.match(/\*(\d+)$/);if(m){n=+m[1];t=t.slice(0,m.index);}
  const pi=t.indexOf('+');if(pi>=0){el=t.slice(pi+1);t=t.slice(0,pi);}const ci=t.indexOf(':');if(ci>=0){ec=t.slice(ci+1);t=t.slice(0,ci);}
  for(let i=0;i<n;i++){if(t==='pair'){out.push({type:'pair',ec:'g',el:''});continue;}out.push(mkTok(t==='?'?R.guest:t,ec,el));}}
 return out;}
// BIG rooms (the last wave, and every wave at heat 5): one plain enemy in each squad is Big
function makeSquad(q,o){const toks=parseToks(q.c||'');
 if(o.big){const plain=toks.filter(t=>!t.el&&t.type!=='pair');if(plain.length)plain[Math.floor(rnd()*plain.length)].el='Big';}
 return {d:(q.d||[0]).slice(),toks,ring:q.ring||0,low:q.low,gap:q.gap,pop:q.pop};}
function startWave(o){const w=o.w;R.waveN++;R.wave=R.waveN;R.wv=w;R.room=o;R.guest=o.guest||'runner';R.waveT=0;R.kills=0;R.spawnT=0.8;R.orderI=0;R.doorI=0;R.phase='wave';R.boss=null;R.inBoss=false;R.trickFree=false;
 clearField();
 R.forceEc=w.flip?'g':null;R.flipDone=false;
 R.blocks=(w.blocks||[]).map(k=>Object.assign({},k,k.mv?{mv:Object.assign({},k.mv)}:{}));
 R.squads=(w.script||[]).map(q=>makeSquad(q,o));
 // GOLDEN: one plain enemy in a later squad
 if(o.gold){const later=R.squads.slice(1).filter(q=>q.toks.some(t=>!t.el&&t.type!=='pair'));if(later.length){const q=pickR(later);pickR(q.toks.filter(t=>!t.el&&t.type!=='pair')).el='Golden';}}
 R.trick=w.trick?{round:0,flick:-1,k0:0,n:0,perfect:0,free:false}:null;
 placeTerrain(false);
 for(const p of w.place||[]){const e=spawnAt(p.t,p.x,p.y,null,{hold:p.hold,el:p.el||''});e.placed=true;}
 if(R.trick)trickRound();
 R.total=R.enemies.filter(e=>!ETYPES[e.type].noCount).length;for(const q of R.squads)for(const t of q.toks)R.total+=t.type==='pair'?2:1;
 // a new kind's intro wave marks it as met
 if(o.intro&&!R.practice&&!META.seen.includes(o.intro)){META.seen.push(o.intro);R.met=o.intro;META.newOk=false;save();}
 // the wave's name, briefly, near the top. Its rule stays in the HUD for the whole wave.
 pop((w.k==='test'||loopRoom()?'':'WAVE '+R.waveN+' · ')+w.name,180,64,o.intro?'#ffd23f':'#fff',18,1.8);
 if(R.waveN===1&&R.heat>1)pop('HEAT '+R.heat+': '+HEAT_RULES[R.heat-1],180,90,'#ff8a5c',12,2.4);}
// waves end when everything that counts is dead; HIVES when the three nests break
function waveDone(){const w=R.wv;if(!w)return false;
 if(w.hives)return !R.enemies.some(e=>!e.dead&&e.type==='nest')&&!R.pending.some(p=>p.tok.type==='nest');
 if(R.trick&&R.trick.round<3)return false;
 return !R.squads.length&&!R.pending.length&&!R.enemies.some(e=>!e.dead&&!ETYPES[e.type].noCount);}
// COLOUR FLIP: once half the wave is dead, everything green (alive or still to come) turns blue
function doFlip(){R.flipDone=true;R.forceEc='b';for(const e of R.enemies)if(!e.dead&&e.ec==='g'){e.ec='b';R.rings.push({x:e.x,y:e.y,r:e.r+10,t:0,life:0.3,col:colOf('b')});}
 pop('COLOUR FLIP: EVERYTHING IS BLUE',180,200,colOf('b'),16,1.6);sfx.bell(true);shake(4,0,0);}
// TRICK SHOT: five green targets stand on the path of one bank shot off a side wall, from wherever the ball is now
function trickPath(){const b=R.ball;
 for(let n=0;n<300;n++){const side=rnd()<0.5?0:1,wx=side===0?b.r:W-b.r,ty=40+rnd()*(AH-80),dx=wx-b.x,dy=ty-b.y,L=Math.hypot(dx,dy);if(Math.abs(dx)<70||L>420)continue;
  const ux=-dx/L,uy=dy/L,pts=[];let ok=true;
  for(let i=0;i<5;i++){const t=60+i*48,x=wx+ux*t,y=ty+uy*t;if(x<28||x>W-28||y<28||y>AH-28||Math.hypot(x-b.x,y-b.y)<60){ok=false;break;}pts.push({x,y});}
  if(ok)return pts;}
 return null;}
function trickRound(){const tr=R.trick;tr.round++;const pts=trickPath();if(!pts){tr.round=3;return;}
 for(const p of pts){const e=spawnAt('runner',p.x,p.y,null,{ec:'g'});e.target=true;e.placed=true;}
 tr.flick=-1;pop('TRICK SHOT '+tr.round+'/3: ALL 5 IN ONE FLICK',180,AH-90,'#ffd23f',13,2.6);}
// once the flick that started on the targets is over: all five down is a TRICK SHOT (+300, and the first one in a wave earns an extra pick). Survivors wake up.
function trickStep(){const tr=R.trick,b=R.ball;
 if(tr.flick>=0&&!b.hot&&b.commit<=0&&!R.minis.length){const left=R.enemies.filter(e=>e.target&&!e.dead).length;
  if(left===0&&R.kills-tr.k0>=tr.n){tr.perfect++;R.score+=300;pop('TRICK SHOT! +300',180,200,'#ffd23f',26,1.4);sfx.bell(true);if(!tr.free){tr.free=true;R.freeDue++;R.rewards.push('TRICK SHOT');pop('+1 PICK AFTER THE WAVE',180,228,'#ffd23f',14,1.6);}}
  else if(left>0)pop('MISSED '+left+': NOW THEY MOVE',180,220,'#ff8a5c',14,1.0);
  for(const e of R.enemies)e.target=false;tr.flick=-2;}
 if(tr.round<3&&!R.enemies.some(e=>!e.dead)&&!R.pending.length)trickRound();}

// ================= bosses =================
// every boss is made of enemy parts (so blasts, fire, lightning and paint all work on them), plus THE WALL, which is a moving block
function bpart(type,x,y,o){const e=spawnAt(type,x,y,null,o);e.boss=R.boss;e.placed=true;R.boss.parts.push(e);return e;}
const BOSS_INIT={
 kings:(bs,hb)=>{for(const [x,c] of [[110,'b'],[250,'g']]){const e=bpart('king',x,90,{ec:c});e.hp=e.maxHp=16+4*hb;e.s={};}bs.rev=null;},
 wall:(bs,hb)=>{const k={x:65,y:-40,w:230,h:34,boss:true};R.blocks.push(k);bs.wall=k;bs.hp=bs.maxHp=20+5*hb;bs.col='g';bs.colT=6;bs.st='down';bs.hitT=0;bs.armorT=0;},
 knight:(bs,hb)=>{const e=bpart('knight',180,130,{ec:'g'});e.hp=e.maxHp=12+3*hb;e.s={dash:null,dizzy:0,copy:null};},
 jugg:(bs,hb)=>{const e=bpart('jugg',180,100,{ec:'b'});e.hp=e.maxHp=20+5*hb;e.s={st:'aim',t:2,dx:0,dy:1,n:0,sx:0,sy:0,bounced:false};}
};
function startBoss(key){if(!BOSSES[key])key='kings';R.phase='boss';R.inBoss=true;R.wv=null;R.room=null;R.blocks=[];R.squads=[];R.waveT=0;R.forceEc=null;R.trick=null;clearField();placeTerrain(false);
 const B=BOSSES[key];R.boss={key,name:B.name,t:0,phase:1,active:false,parts:[],enraged:false};
 BOSS_INIT[key](R.boss,R.heat-1);for(const p of R.boss.parts)p.shell=true;
 R.bossMax=R.boss.wall?R.boss.maxHp:R.boss.parts.reduce((a,p)=>a+p.maxHp,0);
 pop(B.name,180,96,'#ff8fb8',26,1.6);sfx.roar();shake(6,0,1);}
// how much boss is left, 0 to 1 (the Twin Kings count both kings, dead or alive)
function bossFrac(){const bs=R.boss;if(!bs)return 0;if(bs.wall)return clamp(bs.hp/bs.maxHp,0,1);let h=0;for(const p of bs.parts)if(!p.dead)h+=Math.max(0,p.hp);return clamp(h/(R.bossMax||1),0,1);}
function bossPartDied(e){const bs=e.boss;if(!bs||R.phase!=='boss')return;
 if(bs.key==='kings'){const other=bs.parts.find(p=>p!==e&&!p.dead);if(other){bs.rev={x:e.x,y:e.y,ec:e.ec,maxHp:e.maxHp,t:8};if(bs.phase===1){bs.phase=2;pop(PHASE2.kings,180,96,'#ff6b6b',18,1.4);sfx.roar();}}else bs.rev=null;}
 if(!bs.parts.some(p=>!p.dead))bossDie();}
function bossDie(){const bs=R.boss;if(R.phase!=='boss')return;R.phase='bossdead';R.endT=1.5;buffered=null;R.clearTime=R.gt;R.bossesBeaten++;
 const k=bs.wall,c=k?{x:k.x+k.w/2,y:k.y+k.h/2}:(bs.parts[bs.parts.length-1]||{x:180,y:150});
 burst(c.x,c.y,'#c0507a',40);burst(c.x,c.y,'#d9dfe8',12);shake(9,0,1);R.freeze=Math.max(R.freeze,0.1);sfx.boom();sfx.roar();
 for(const e of R.enemies)if(!e.dead)burst(e.x,e.y,colOf(e.ec),6);R.enemies.length=0;R.pending.length=0;R.stomps.length=0;R.pickups.length=0;R.shots.length=0;R.marks.length=0;R.patches.length=0;R.ball.leech=null;
 if(k)R.blocks=R.blocks.filter(q=>q!==k);
 R.score+=500;R.clearName=bs.name;R.clearTitle=bs.name+' DOWN';pop(R.clearTitle,180,220,'#7dffa0',26,1.5);}
// the boss is the end of the run
function afterBoss(){finishRun();}

// ================= physics (shared by ball, minis and the aim line) =================
function holeAt(s,p){for(const h of R.holes)if(h.s===s&&p>=h.a&&p<=h.b)return h;return null;}
function onIce(x,y){for(const i of R.ice){const dx=x-i.x,dy=y-i.y;if(dx*dx+dy*dy<i.r*i.r)return i;}return null;}
// walls, wrap holes and blocks. In a wrap hole the ball goes through the wall and comes out the other side (b.wrapped this step).
function wallStep(b,dt,keep,kick,cb){
 b.x+=b.vx*dt;b.y+=b.vy*dt;let hit=-1;b.wrapped=false;const hs=!b.nw&&R&&R.holes.length>0;
 if(b.x-b.r<0){if(hs&&holeAt(0,b.y)){if(b.x<0){b.x+=W;b.wrapped=true;}}else{b.x=b.r;b.vx=Math.abs(b.vx);hit=0;}}
 else if(b.x+b.r>W){if(hs&&holeAt(1,b.y)){if(b.x>W){b.x-=W;b.wrapped=true;}}else{b.x=W-b.r;b.vx=-Math.abs(b.vx);hit=1;}}
 if(b.y-b.r<0){if(hs&&holeAt(2,b.x)){if(b.y<0){b.y+=AH;b.wrapped=true;}}else{b.y=b.r;b.vy=Math.abs(b.vy);hit=hit<0?2:hit;}}
 else if(b.y+b.r>AH){if(hs&&holeAt(3,b.x)){if(b.y>AH){b.y-=AH;b.wrapped=true;}}else{b.y=AH-b.r;b.vy=-Math.abs(b.vy);hit=hit<0?3:hit;}}
 if(!b.nw&&R&&R.blocks)for(const k of R.blocks){if(b.thru&&!k.boss)continue;const cx=clamp(b.x,k.x,k.x+k.w),cy=clamp(b.y,k.y,k.y+k.h);let dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy);if(d>=b.r)continue;if(d<0.001){dx=0;dy=b.vy>0?-1:1;d=1;}
  const nx=dx/d,ny=dy/d;b.x=cx+nx*b.r;b.y=cy+ny*b.r;const dot=b.vx*nx+b.vy*ny;if(dot<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny;if(hit<0){hit=4;b.blk=k;b.bnx=nx;b.bny=ny;}}}
 if(hit>=0){const s=Math.hypot(b.vx,b.vy);if(s>0){const ns=Math.min(1200,s*keep+kick);b.vx*=ns/s;b.vy*=ns/s;}if(cb)cb(hit,b);}
}
// push b out of circle (cx,cy,cr); reflect if moving inward. returns true on reflect
function circleBounce(b,cx,cy,cr,keep,kick,toSpeed){const dx=b.x-cx,dy=b.y-cy,d=Math.hypot(dx,dy),rr=b.r+cr;if(d>=rr)return false;
 const nx=d>0?dx/d:1,ny=d>0?dy/d:0;const dot=b.vx*nx+b.vy*ny;b.x=cx+nx*rr;b.y=cy+ny*rr;if(dot>=0)return false;
 b.vx-=2*dot*nx;b.vy-=2*dot*ny;const s=Math.hypot(b.vx,b.vy);if(s>0){const ns=toSpeed?toSpeed:Math.min(1200,s*keep+kick);b.vx*=ns/s;b.vy*=ns/s;}return true;}
// a post resets the ball to full speed; once the ball has been hot for over 2 s in one flick the reset fades so no build loops forever.
// A blue (heavy) ball treats posts like walls: no reset to full speed.
function bumperStep(b,bumpers,cb){const h=b.hotT||0;const full=h>2?Math.max(300,1200-900*(h-2)):1200;for(const bu of bumpers){if(circleBounce(b,bu.x,bu.y,bu.r,b.heavy?C.keepH:1,0,b.heavy?0:full)&&cb)cb(bu,b);}}
// wall keep / kick for this ball: blue keeps 98% plus a small kick (more with BOUNCY WALLS)
const keepOf=b=>b.heavy?C.keepH:C.keep,kickOf=b=>b.heavy?C.kickH:C.kick;
// SLIMER trails make the ball slow down three times as fast
function decelOf(b){const x=b.hotT>2?600*(b.hotT-2):0;let d=(R&&R.ice.length&&!b.nw&&onIce(b.x,b.y))?ICE_DECEL:(b.heavy?HEAVY_DECEL:DECEL);if(R&&R.slime.length&&!b.nw&&onSlime(b.x,b.y))d*=3;return d+x;}
// the one motion step shared by the ball, the twin, the aim line and the commit-window ghost: slowStep (speed, stop under 40, hot flag) then bounceMove (walls, posts)
// MAGNET: bends a moving ball toward it without changing its speed (the aim line runs this too, so it shows the curve)
function slowStep(b,dt){let s=Math.hypot(b.vx,b.vy);if(s>0&&R&&R.mags&&R.mags.length&&!b.nw){for(const m of R.mags){const dx=m.x-b.x,dy=m.y-b.y,d2=dx*dx+dy*dy;if(d2>220*220||d2<1)continue;const d=Math.sqrt(d2),a=9e6/(d2+3000)*dt;b.vx+=dx/d*a;b.vy+=dy/d*a;}const s2=Math.hypot(b.vx,b.vy)||1;b.vx*=s/s2;b.vy*=s/s2;}if(s>0){const ns=Math.max(0,s-decelOf(b)*dt);if(ns<40){b.vx=0;b.vy=0;s=0;}else{b.vx*=ns/s;b.vy*=ns/s;s=ns;}}

function bounceMove(b,dt,bumpers,onW,onB){wallStep(b,dt,keepOf(b),kickOf(b),onW);bumperStep(b,bumpers,onB);}

// the aim line runs the same steps as the real ball, so ice, posts, bouncy walls and wrap holes all show up in it.
// If the ball goes cold before bounce (bounces+1), cold={x,y} is where (pts[coldI]), the sim rolls on to the real stop and stop={x,y} is where it ends;
// otherwise cold=null and the line is 'bounces' + a 60-unit stub. evs lists every bounce ('wall','block','post') and wrap, for Chameleon colours.
function simLine(x,y,vx,vy,r,bounces,bumpers,slow,heavy,thru){const b={x,y,vx,vy,r,hot:true,hotT:0,heavy:!!heavy,thru:!!thru};const pts=[{x,y}],dots=[],evs=[];let n=0,stub=0,stubbing=false,stubEnd=-1,over=false,cold=null,coldI=0,stop=null;
 for(let i=0;i<900;i++){
  if(slow&&!over){const s=slowStep(b,STEP);if(s===0){stop={x:b.x,y:b.y};break;}if(!cold&&!b.hot){cold={x:b.x,y:b.y};coldI=pts.length-1;}}
  let bounced=false,kind='';bounceMove(b,STEP,bumpers,h=>{bounced=true;kind=h===4?'block':'wall';},()=>{bounced=true;kind='post';});

  if(stubbing&&stubEnd<0){stub+=Math.hypot(b.vx,b.vy)*STEP;if(stub>=60){stubEnd=pts.length;if(!slow||over)break;}}
  if(bounced){dots.push({x:b.x,y:b.y,i:pts.length-1});n++;if(n>=bounces&&!stubbing){stubbing=true;stub=0;}if(slow&&n>=bounces+1){over=true;if(stubEnd>=0)break;}}}
 if(slow&&!cold&&stubEnd>=0){pts.length=stubEnd;while(dots.length&&dots[dots.length-1].i>=stubEnd)dots.pop();while(evs.length&&evs[evs.length-1].i>=stubEnd)evs.pop();}
 if(cold&&!stop)stop={x:b.x,y:b.y};

// ================= input =================
// full-pull distance for this shot: min(PULL setting, free room from the anchor to the screen edge in the pull direction), never under 70
function pullFull(ux,uy){const x0=-ox/sc,x1=(vw-ox)/sc,y0=-oy/sc,y1=(vh-oy)/sc;let t=1e9;
 if(ux>1e-6)t=Math.min(t,(x1-P.ax)/ux);else if(ux<-1e-6)t=Math.min(t,(x0-P.ax)/ux);
 if(uy>1e-6)t=Math.min(t,(y1-P.ay)/uy);else if(uy<-1e-6)t=Math.min(t,(y0-P.ay)/uy);
 return Math.max(70,Math.min(SET.pull,t-2));}
// the blue/green halfway point is a fixed finger distance (SET.pull/2) unless the screen edge is so close that green could not be reached
function pullPower(){const dx=P.x-P.ax,dy=P.y-P.ay,L=Math.hypot(dx,dy);if(L<30)return null;const fc=pullFull(dx/L,dy/L),full=fc>=SET.pull*0.75?SET.pull:fc;return {L,ux:dx/L,uy:dy/L,pw:clamp((L-30)/(full-30),0,1)};}
// BLUE (pw under TIER_B) is the soft shot: 500-740, heavy physics, stops after about 100-230. GREEN 1000-1200 (830-1200).
function launchFromPull(){const s=pullPower();if(!s)return null;const pw=s.pw,tier=tierOf(pw),heavy=tier==='b';let spd;
 if(heavy)spd=HEAVY_V0+(HEAVY_V1-HEAVY_V0)*(pw/TIER_B);
 else spd=1000+200*((pw-TIER_Y)/(1-TIER_Y));
 spd*=C.spdMul;if(R&&R.ball&&R.ball.leech)spd*=0.6;let dx=-s.ux,dy=-s.uy;if(SET.push){dx=-dx;dy=-dy;}return {vx:dx*spd,vy:dy*spd,pw,heavy,tier};}
// the ball's colour right now: its launch colour, swapped by CHAMELEON. White (hits anything) under a RAINBOW STAR or after Chameleon's 3rd swap.
function colourNow(b){if(b.white||(b===R.ball&&fxOn('Star')))return 'w';return b.flips%2?other(b.col):b.col;}
// where a shot released now would really leave from: while launch is locked out (commit>0), run a copy of the ball through the same
// moveStep for the rest of the lockout. A shot released in the lockout is queued (buffered) and fires from wherever the ball really is.
function firePoint(){const b=R.ball;if(b.commit<=0)return {x:b.x,y:b.y,ghost:false};
 const g={x:b.x,y:b.y,vx:b.vx,vy:b.vy,r:b.r,hot:b.hot,hotT:b.hotT,heavy:b.heavy,thru:b.thru};let c=b.commit;
 while(c>0){c-=STEP;if(c<=0)break;moveStep(g,STEP,R.bumpers,null,null);}return {x:g.x,y:g.y,ghost:true};}
function fire(v){const b=R.ball;b.vx=v.vx;b.vy=v.vy;b.heavy=!!v.heavy;b.col=v.tier||(v.heavy?'b':'g');b.white=false;b.flips=0;b.bounces=0;b.wallRun=0;b.hotT=0;b.hits.clear();b.passed.clear();b.iceSeen.clear();b.blasted=false;b.shocks=0;b.chain=0;b.last=null;b.split=false;b.fireT=0;b.commit=0.5;b.punch=0.04;R.flicks++;
 meltSnow(b);b.melted=false;
 if(b.col==='b')R.heavyN++;else R.fullN++;if(b.heavy)sfx.launchHeavy();else sfx.launch();vib(8);
 if(R.twin.n>0){R.twin.n--;launchTwin(v);}
 knightCopy(v);
 if(R.trick&&R.trick.flick===-1&&R.enemies.some(e=>e.target&&!e.dead)){R.trick.flick=R.flicks;R.trick.k0=R.kills;R.trick.n=R.enemies.filter(e=>e.target&&!e.dead).length;}}

  if(tier!==P.tier){sfx.click(tier==='g'?3:1);vib(6);}P.tier=tier;P.heavy=tier==='b';}}

// ================= fx helpers =================
function pop(txt,x,y,col,size,life){R.pops.push({txt,x,y,col:col||'#fff',size:size||16,t:0,life:life||0.6});if(R.pops.length>12)R.pops.shift();}
// a long message split over lines
function popWrap(s,x,y,col,size,life){const ls=wrap(s,300,size);for(let i=0;i<ls.length;i++)pop(ls[i],x,y+i*(size+5),col,size,life);}
// one hit pop, placed on the far side of the target (x,y,r) from the source (sx,sy); no source = above the target
function farPop(t,x,y,r,sx,sy,col,size){let dx=x-(sx==null?x:sx),dy=y-(sy==null?y+1:sy);const d=Math.hypot(dx,dy);if(d<0.001){dx=0;dy=-1;}else{dx/=d;dy/=d;}pop(t,x+dx*(r+14),y+dy*(r+14),col,size,0.5);}
function shake(mag,dx,dy){const s=R.shake;mag*=[0,0.35,1][SET.shake];if(!mag)return;if(mag>=s.mag*(s.t/0.2)){s.mag=mag;s.t=0.2;s.dx=dx||0;s.dy=dy||0;}}

function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=100+Math.random()*150;R.chunks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:3,col,t:0});}if(R.chunks.length>40)R.chunks.splice(0,R.chunks.length-40);}

function sparks(x,y,side0){const side=side0>3?2:side0;for(let i=0;i<6;i++){const a=Math.random()*TAU;let vx=Math.cos(a)*180,vy=Math.sin(a)*180;if(side===0)vx=Math.abs(vx);if(side===1)vx=-Math.abs(vx);if(side===2)vy=Math.abs(vy);if(side===3)vy=-Math.abs(vy);part(x,y,vx,vy,'#ffe9a0',2,0.25);}}
function puff(x,y){for(let i=0;i<7;i++){const a=Math.random()*TAU,s=30+Math.random()*60;part(x,y,Math.cos(a)*s,Math.sin(a)*s,'#9aa0b0',4+Math.random()*3,0.4);}}
function chainBump(b){if(b!==R.ball)return;b.chainPop=0.15;if(b.chain>R.bestChain)R.bestChain=b.chain;if(b.chain===5)sfx.bell(false);if(b.chain===10)sfx.bell(true);}
// a timed power-up effect (for the HUD bar and fxOn)

// ================= combat =================
function tierDmg(chain){return chain>=6?3:chain>=3?2:1;}
// TWO-TONE: the half facing (sx,sy) is green on the tA side, blue on the other
function ecAt(e,sx,sy){if(e.ec!=='t')return e.ec;if(sx==null)return null;return Math.cos(Math.atan2(sy-e.y,sx-e.x)-e.tA)>=0?'g':'b';}
// can a hit of colour c from (sx,sy) hurt e? It must match the enemy's colour (two-tone: the half it hits), or the paint on it.
// Grey enemies take any colour. White hurts anything.
function matches(c,e,sx,sy){if(c==='w')return true;if(e.paintT>0&&e.paint===c)return true;if(e.ec==='x')return !e.invuln;if(e.ec==='t'){const h=ecAt(e,sx,sy);return h?h===c:(c==='g'||c==='b');}return c===e.ec;}
function popBubble(e){e.bubble=0;e.cd=Math.max(e.cd,0.15);R.rings.push({x:e.x,y:e.y,r:e.r+12,t:0,life:0.25,col:'#d9f2ff'});pop('POP',e.x,e.y-e.r-14,'#d9f2ff',13,0.4);sfx.pop();}

// A bubble soaks up the first hit; armour (shell) and the untouchable (mirror, underground, in the air) take nothing.
function damageEnemy(e,dmg,src,sx,sy,col,size,by){if(e.dead)return;

 if(e.invuln||e.shell||e.under||e.air||(e.boss&&!e.boss.active)){e.armorT=0.12;e.hitT=0.06;return;}
 if(fxOn('TimeStop')&&upL('TimeStop')>=3)dmg*=2;if(e.type==='charger'&&e.s.dizzy>0&&src==='ball')dmg+=1;
 e.hp-=dmg;e.hitT=0.1;if(e.boss)R.score+=15*dmg*Math.max(1,(by||R.ball).chain||0)*(fxOn('Gold')?2:1);
 if(e.hp>0&&e.maxHp>1&&src!=='fire'&&!e.boss){e.daze=Math.max(e.daze||0,e.maxHp>=3?1.0:0.8);e.lg=null;}
 farPop(''+dmg,e.x,e.y,e.r,sx,sy,col||'#fff',size||15);
 if(e.type==='flipper'&&e.hp>0&&(e.ec==='g'||e.ec==='b')){e.ec=other(e.ec);R.rings.push({x:e.x,y:e.y,r:e.r+9,t:0,life:0.25,col:colOf(e.ec)});sfx.flip();}

// hc = the colour a hit carries ('w' = any). The wrong colour does no damage, but it still pops a bubble.
function hurt(e,dmg,hc,src,sx,sy,col,size,by){if(e.dead)return false;if(e.bubble&&!e.under&&!e.air){popBubble(e);return true;}if(!matches(hc,e,sx,sy)){e.hitT=0.06;return false;}damageEnemy(e,dmg,src,sx,sy,col,size,by);return true;}

function knock(e,nx,ny,kb,c){const m=e.kbm;if(!m||e.under||e.s.on)return;e.kx=nx*kb*m;e.ky=ny*kb*m;e.kdec=kb/0.5;e.kc=c;e.splatOk=false;e.lg=null;}
function killEnemy(e,src,by){if(e.dead)return;e.dead=true;
 const b=by||R.ball,c=b.chain||0;let s=(src==='mini'||src==='multi')?10:10*Math.max(1,c);if(fxOn('Gold'))s*=2;R.score+=s;R.kills++;R.totalKills++;burst(e.x,e.y,colOf(e.ec==='t'?'w':e.ec),5+2*Math.min(c,6));
 if((fxOn('Gold')&&upL('Gold')>=3)||(fxOn('Star')&&upL('Star')>=3)){R.score+=50;pop('+50',e.x,e.y-e.r-18,'#ffd23f',15,0.7);sfx.coin();}

 if(fxOn('Domino'))R.dq.push({x:e.x,y:e.y,c:e.ec==='x'||e.ec==='t'?(R.fx.Domino.c||'w'):e.ec,link:e.dlink||0,t:0.09});
 const mb=R.ball;R.freeze=Math.max(R.freeze,Math.min(0.12,0.05+0.015*c));const sp=Math.hypot(mb.vx,mb.vy)||1;shake(Math.min(6,1+0.6*c),mb.vx/sp,mb.vy/sp);sfx.kill();vib(c>=5?30:14);

function lastKillFx(e){burst(e.x,e.y,'#ffffff',10);burst(e.x,e.y,colOf(e.ec==='t'?'w':e.ec),10);R.rings.push({x:e.x,y:e.y,r:90,t:0,life:0.45,col:'#ffffff'});R.freeze=Math.max(R.freeze,0.14);R.slowT=0.45;shake(6,0,1);vib(40);}
// what happens when an enemy dies: splits, explosions, drops and rewards
function onDeath(e,src){const T=ETYPES[e.type];
 if(R.ball.leech===e)R.ball.leech=null;
 if(e.mate){e.mate.mate=null;e.mate=null;}
 if(e.type==='splitter'){const c=e.ec==='g'?'b':e.ec==='b'?'g':(Math.random()<0.5?'g':'b');for(const s of [-1,1])spawnAt('splitling',clamp(e.x+s*10,10,W-10),e.y,null,{ec:c});}

  if(e.el==='Golden'){R.score+=200;if(!loopRoom()){R.freeDue++;R.rewards.push('GOLDEN');}pop('GOLDEN! +1 PICK AFTER THE WAVE',180,110,'#ffd23f',15,1.6);sfx.coin();sfx.bell(true);}}

// a hot ball (the main ball, the twin or the rival) touches an enemy. Its colour must match; the wrong colour only shoves (GHOST BALL: passes through).

// Solid enemies (bosses, nests) also bounce the ball off.
function isArmoured(e,nx,ny,b){if(e.frz>0)return false;if(e.shell)return true;const fd=Math.cos(e.face)*nx+Math.sin(e.face)*ny;

function solidBounce(b,e){circleBounce(b,e.x,e.y,e.r,b.heavy?0.85:0.9,0,false);}

function puTick(dt){if(!(R.phase==='wave'||(R.phase==='boss'&&R.boss&&R.boss.active)))return;const TS=fxOn('TimeStop');

 if(!CARDS[k].wild){const L=leftByCol();let pb=0.5;if(R.phase!=='boss'){if(!L.b&&L.g)pb=0;else if(!L.g&&L.b)pb=1;else if(L.b+L.g)pb=clamp(L.b/(L.b+L.g),0.2,0.8);}c=Math.random()<pb?'b':'g';}

 for(let i=0;i<70;i++){const relax=i>45,a=Math.random()*TAU,d=relax?(near?60+Math.random()*200:140+Math.random()*320):(near?70+Math.random()*100:(c==='w'?110:230)+Math.random()*190);const x=b.x+Math.cos(a)*d,y=b.y+Math.sin(a)*d;
  if(x<28||x>W-28||y<28||y>AH-28)continue;

  if(R.bumpers.some(u=>Math.hypot(x-u.x,y-u.y)<36)||R.kegs.some(u=>!u.dead&&Math.hypot(x-u.x,y-u.y)<36)||R.pickups.some(u=>Math.hypot(x-u.x,y-u.y)<50))continue;
  if(R.enemies.some(e=>Math.hypot(x-e.x,y-e.y)<e.r+20)||(R.boss&&R.boss.wall&&x>R.boss.wall.x-24&&x<R.boss.wall.x+R.boss.wall.w+24&&y>R.boss.wall.y-24&&y<R.boss.wall.y+R.boss.wall.h+24))continue;
  R.pickups.push({k,x,y,c,t:0,life:PU_LIFE,wrong:0});R.rings.push({x,y,r:30,t:0,life:0.3,col:colOf(c)});sfx.small();
  if(!R.puSeen){R.puSeen=true;pop(c==='w'?'WILD PICKUP: ANY PULL GRABS IT':c==='b'?'BLUE PICKUP: GRAB IT WITH A SHORT PULL':colName('g')+' PICKUP: GRAB IT WITH A FULL PULL',180,AH-64,colOf(c),12,2.6);}
  return true;}
 return false;}

 for(let i=0;i<n;i++){let best=null,bd=i===0?1e9:180;for(const e of R.enemies){if(e.dead||done.has(e)||e.under||e.air||e.shell||e.invuln||!matches(c,e))continue;const d=Math.hypot(e.x-px,e.y-py);if(d<bd){bd=d;best=e;}}

// DOMINO: each kill during it blows up a moment later, hurting the dead enemy's colour nearby (level 3: bigger with each link)

// ================= stepping =================
function ballStep(dt){const b=R.ball;
 if(b.commit>0){b.commit-=dt;if(b.commit<=0&&buffered){fire(buffered);buffered=null;}}
 const wasHot=b.hot,moving=b.vx!==0||b.vy!==0;
 const s=slowStep(b,dt);
 if(wasHot&&!b.hot){puff(b.x,b.y);sfx.skid();b.trail.length=0;}
 if(moving&&s===0){if(b.heavy)thud();if(C.blast)blastAt(b.x,b.y,colourNow(b),C.blastR,C.blastD);meltSnow(b);}
 if(s>0){bounceMove(b,dt,R.bumpers,onWall,onBumper);if(b.wrapped){b.trail.length=0;onWrap(b);}}
 if(b.hot){b.trail.push({x:b.x,y:b.y});if(b.trail.length>12)b.trail.shift();}
 if(C.fire&&b.hot){b.fireT-=dt;if(b.fireT<=0){b.fireT=0.04;addFire(b.x,b.y,14,C.trailLife,colourNow(b));}}
 if(b.inv>0)b.inv-=dt;
 if(C.shieldMax&&b.shield<C.shieldMax){b.shieldT-=dt;if(b.shieldT<=0){b.shield++;b.shieldT=C.shieldRe;R.rings.push({x:b.x,y:b.y,r:b.r+14,t:0,life:0.3,col:'#9fe6ff'});sfx.small();}}
 if(C.snow&&b.hot&&R.ice.length&&hasCombo('AVALANCHE')){const ip=onIce(b.x,b.y);if(ip&&!b.iceSeen.has(ip.i)){b.iceSeen.add(ip.i);if(b.snow<C.snowMax+1){b.snow++;b.r=C.ballR+snowR(b.snow);pop('AVALANCHE',b.x,b.y-b.r-16,'#dff6ff',13,0.5);}}}
 grabCheck(b);
 const es=R.enemies,TS=fxOn('TimeStop');
 if(b.hot){
  for(const e of es){if(e.dead||e.cd>0||e.air||e.under||e.s.on||(e.s.fade&&!C.ghost)||(e.boss&&!e.boss.active))continue;const dx=b.x-e.x,dy=b.y-e.y,d=Math.hypot(dx,dy);if(d>=b.r+e.r)continue;ballHit(b,e,d>0?dx/d:1,d>0?dy/d:0);if(R.phase==='bossdead')break;}
 }else if(R.phase!=='dead'&&R.phase!=='bossdead'){
  for(const e of es){if(e.dead||e.air||e.under||e.s.on||e.s.fade)continue;const dx=b.x-e.x,dy=b.y-e.y,d=Math.hypot(dx,dy);if(d>=b.r+e.r)continue;const nx=d>0?dx/d:1,ny=d>0?dy/d:0;
   // solid bodies push a resting ball out of the way
   if(ETYPES[e.type].solid){b.x=clamp(e.x+nx*(b.r+e.r+1),b.r,W-b.r);b.y=clamp(e.y+ny*(b.r+e.r+1),b.r,AH-b.r);}
   if(b.inv>0||TS||!bites(e)||e.stun>0||e.daze>0||e.frz>0||e.s.dizzy>0||(e.boss&&!e.boss.active))continue;
   hurtBall(e,nx,ny);if(ETYPES[e.type].solid){b.vx=nx*280;b.vy=ny*280;}
   if(e.type==='jugg'&&e.s.st==='charge')juggCrack(e);
   break;}
 }}
// mini balls (SPLITTER, SHRAPNEL) hit each enemy once; MULTIBALL balls keep bouncing and can hit the same enemy again after 0.4 s
function minisStep(dt){const pin=hasCombo('PINBALL');
 for(const m of R.minis){m.t+=dt;wallStep(m,dt,1,0,null);
  if(pin||m.multi)for(const bu of R.bumpers){if(circleBounce(m,bu.x,bu.y,bu.r,1,0,m.multi?650:900)&&pin&&!m.multi){if((m.ext||0)<3){m.ext=(m.ext||0)+1;m.life=Math.max(m.life,m.t+0.5);}if(!(bu.zapT>0)){bu.zapT=0.3;bu.hitT=0.15;R.rings.push({x:bu.x,y:bu.y,r:60,t:0,life:0.2,col:'#b48cff'});sfx.small();for(const e of R.enemies){if(!e.dead&&Math.hypot(e.x-bu.x,e.y-bu.y)<60+e.r)hurt(e,1,m.c,'zap',bu.x,bu.y,'#d9c4ff',15);}}}}
  for(const e of R.enemies){if(e.dead||e.under||e.air||e.s.on||e.s.fade)continue;const dx=m.x-e.x,dy=m.y-e.y,d=Math.hypot(dx,dy);if(d>=m.r+e.r)continue;
   if(m.multi){const last=m.hits.get(e);if(last!=null&&m.t-last<0.4)continue;m.hits.set(e,m.t);circleBounce(m,e.x,e.y,e.r,1,0,650);
    if(e.bubble)popBubble(e);else if(matches(m.c,e,m.x,m.y)){const nx=d>0?dx/d:1,ny=d>0?dy/d:0;knock(e,-nx,-ny,250,m.c);damageEnemy(e,1,'multi',m.x,m.y);sfx.small();}else sfx.thunk();continue;}
   if(m.hits.has(e))continue;m.hits.add(e);
   if(e.bubble){popBubble(e);continue;}if(!matches(m.c,e,m.x,m.y)){circleBounce(m,e.x,e.y,e.r,1,0,false);sfx.thunk();continue;}
   damageEnemy(e,1,'mini',m.x,m.y);sfx.small();
   if(C.split2&&!m.gen2&&!m.split){m.split=true;const h=Math.atan2(m.vy,m.vx);for(const a of [-0.7,0.7])R.minis.push({x:m.x,y:m.y,vx:Math.cos(h+a)*850,vy:Math.sin(h+a)*850,r:5,t:0,life:0.7,hits:new Set([e]),c:m.c,gen2:true});}}}

// squads: when fewer than the squad's low are alive (or waiting at a door) and its gap has passed, send the next one.

 for(let i=0;i<q.toks.length;i++){const j=i%nd,di=q.d[j],k=Math.floor(i/nd);R.pending.push({tok:q.toks[i],door:di,t:0.8,off:(k-(cnt[j]-1)/2)*28,ph:R.orderI*1.7});R.orderI++;R.doorGlow[di]=0.8;}}

function pendingStep(dt){for(let i=R.pending.length-1;i>=0;i--){const p=R.pending[i];p.t-=dt;if(p.t>0)continue;R.pending.splice(i,1);const T=ETYPES[p.tok.type]||ETYPES.runner;let x,y;

  if(m.kind==='mortar'){R.rings.push({x:m.x,y:m.y,r:m.r,t:0,life:0.3,col:'#ff8a5c'});burst(m.x,m.y,'#ff8a5c',6);sfx.boom();shake(4,0,0);const d=Math.hypot(b.x-m.x,b.y-m.y);if(!b.hot&&d<m.r+b.r*0.5)hurtBall(null,(b.x-m.x)/(d||1),(b.y-m.y)/(d||1));}
  else if(m.kind==='paint'){R.patches.push({x:m.x,y:m.y,r:m.r,c:m.c,t:0,life:9});sfx.splat();}}
 R.marks=R.marks.filter(m=>!m.done);}
function groundStep(dt){if(R.slime.length){for(const s of R.slime)s.t+=dt;R.slime=R.slime.filter(s=>s.t<s.life);}if(R.patches.length){for(const p of R.patches)p.t+=dt;R.patches=R.patches.filter(p=>p.t<p.life);}}
const onSlime=(x,y)=>{for(const s of R.slime)if(Math.hypot(x-s.x,y-s.y)<s.r)return s;return null;};
const onPatch=(x,y)=>{for(const p of R.patches)if(Math.hypot(x-p.x,y-p.y)<p.r)return p;return null;};
// SLIDING WALLS move side to side; built blocks grow in
function blocksStep(dt){for(const k of R.blocks){if(k.built&&k.t<1)k.t+=dt*2.5;if(k.mv){k.x+=k.mv.spd*dt*(fxOn('Slowdown')?1/3:1);if(k.x<k.mv.a){k.x=k.mv.a;k.mv.spd=Math.abs(k.mv.spd);}if(k.x>k.mv.b){k.x=k.mv.b;k.mv.spd=-Math.abs(k.mv.spd);}}}}
// bombers and Explosive elites go off a moment after they die, hurting every enemy close by (any colour)
function boomsStep(dt){if(!R.booms.length)return;for(const q of R.booms)q.t-=dt;const go=R.booms.filter(q=>q.t<=0);if(!go.length)return;R.booms=R.booms.filter(q=>q.t>0);
 for(const q of go){R.rings.push({x:q.x,y:q.y,r:q.r,t:0,life:0.3,col:'#ffb13b'});R.rings.push({x:q.x,y:q.y,r:q.r*0.5,t:0,life:0.2,col:'#ffffff'});burst(q.x,q.y,'#ffb13b',10);sfx.boom();shake(6,0,0);vib(25);
  for(const e of R.enemies){if(e.dead||e.under)continue;const dx=e.x-q.x,dy=e.y-q.y,dd=Math.hypot(dx,dy)||1;if(dd<q.r+e.r){knock(e,dx/dd,dy/dd,380,'w');hurt(e,2,'w','boom',q.x,q.y,'#ffb13b',17);}}
  hurtWallIn(q.x,q.y,q.r,2,'w');}}
function stompsStep(dt){if(fxOn('TimeStop'))return;const b=R.ball;for(const s of R.stomps){s.r+=320*dt;if(!s.hit&&!b.hot&&b.inv<=0){const d=Math.hypot(b.x-s.x,b.y-s.y);if(Math.abs(d-s.r)<b.r+5){s.hit=true;const nx=d>0?(b.x-s.x)/d:1,ny=d>0?(b.y-s.y)/d:0;hurtBall(null,nx,ny);}}}
 R.stomps=R.stomps.filter(s=>s.r<720);}
// fire: an enemy of the fire's colour standing in it takes 1 every 0.5 s (white fire burns anything)
function firesStep(dt){if(!R.fires.length)return;for(const f of R.fires)f.t+=dt;R.fires=R.fires.filter(f=>f.t<f.life);
 for(const e of R.enemies){if(e.dead||e.fireCd>0||e.under||e.air)continue;for(const f of R.fires){if(matches(f.c,e)&&Math.hypot(e.x-f.x,e.y-f.y)<f.r+e.r*0.6){e.fireCd=0.5;damageEnemy(e,1,'fire',e.x,e.y+1,'#ffb13b',14);break;}}}
}
// POWDER KEGS: the game drops kegs on open floor. Any hot ball sets one off in its colour.
function spawnKeg(){const b=R.ball;for(let i=0;i<30;i++){const x=45+Math.random()*(W-90),y=55+Math.random()*(AH-110);
  if(Math.hypot(x-b.x,y-b.y)<110)continue;if(R.bumpers.some(bu=>Math.hypot(x-bu.x,y-bu.y)<45))continue;if(R.enemies.some(e=>!e.dead&&Math.hypot(x-e.x,y-e.y)<e.r+24))continue;if(R.blocks.some(k=>x>k.x-40&&x<k.x+k.w+40&&y>k.y-40&&y<k.y+k.h+40))continue;if(R.kegs.some(k=>Math.hypot(x-k.x,y-k.y)<70))continue;if(R.pickups.some(q=>Math.hypot(x-q.x,y-q.y)<40))continue;
  R.kegs.push({x,y,r:13,lit:0,t:0,dead:false,c:'w'});puff(x,y);return;}}
function blowKeg(k,c){if(k.dead)return;k.dead=true;const r=C.kegR,d=C.kegD;R.rings.push({x:k.x,y:k.y,r,t:0,life:0.25,col:colOf(c)});R.rings.push({x:k.x,y:k.y,r:r*0.5,t:0,life:0.18,col:'#ffb13b'});burst(k.x,k.y,'#c27a3a',8);R.freeze=Math.max(R.freeze,0.06);shake(6,0,0);sfx.boom();vib(30);
 for(const e of R.enemies){if(e.dead||e.under)continue;const dx=e.x-k.x,dy=e.y-k.y,dd=Math.hypot(dx,dy)||1;if(dd<r+e.r){knock(e,dx/dd,dy/dd,380,c);hurt(e,d,c,'keg',k.x,k.y,'#ffb13b',18);}}
 hurtWallIn(k.x,k.y,r,d,c);
 if(C.kegChain)for(const o of R.kegs){if(!o.dead&&!(o.lit>0)&&Math.hypot(o.x-k.x,o.y-k.y)<r+40){o.lit=0.14;o.c=c;}}
 if(hasCombo('NAPALM'))addFire(k.x,k.y,60,2.5,'w');
 if(hasCombo('SHRAPNEL'))spawnBurst(k.x,k.y,4,800,0.6,c);
 R.kegT=Math.max(R.kegT,2.5);}
function kegsStep(dt){const b=R.ball;
 if(C.kegs&&(R.phase==='wave'||R.phase==='boss')){R.kegT-=dt;if(R.kegT<=0&&R.kegs.filter(k=>!k.dead).length<C.kegs){spawnKeg();R.kegT=2;}}
 for(const k of R.kegs){if(k.dead)continue;k.t+=dt;
  if(k.lit>0){k.lit-=dt;if(k.lit<=0){blowKeg(k,k.c||'w');continue;}}
  for(const bb of [b,R.twin.b]){if(!bb||!bb.hot)continue;if(Math.hypot(bb.x-k.x,bb.y-k.y)<bb.r+k.r){if(bb===b){b.chain++;chainBump(b);}pop('KEG!',k.x,k.y-24,'#ffb13b',18,0.5);blowKeg(k,colourNow(bb));break;}}
  if(k.dead||b.hot)continue;const dx=b.x-k.x,dy=b.y-k.y,d=Math.hypot(dx,dy);if(d<b.r+k.r){const nx=d>0?dx/d:1,ny=d>0?dy/d:0;b.x=k.x+nx*(b.r+k.r);b.y=k.y+ny*(b.r+k.r);}}
 if(R.kegs.some(k=>k.dead))R.kegs=R.kegs.filter(k=>!k.dead);}
function fxStep(dt){
 for(const c of R.chunks){c.t+=dt;if(c.t<0.6){c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.x<c.r){c.x=c.r;c.vx*=-0.6;}if(c.x>W-c.r){c.x=W-c.r;c.vx*=-0.6;}if(c.y<c.r){c.y=c.r;c.vy*=-0.6;}if(c.y>AH-c.r){c.y=AH-c.r;c.vy*=-0.6;}c.vx*=0.96;c.vy*=0.96;}}
 if(R.chunks.length&&R.chunks[0].t>=3)R.chunks=R.chunks.filter(c=>c.t<3);
 for(const p of R.parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.95;p.vy*=0.95;}R.parts=R.parts.filter(p=>p.t<p.life);
 for(const p of R.pops){p.t+=dt;p.y-=22*dt;}R.pops=R.pops.filter(p=>p.t<p.life);
 for(const r of R.rings)r.t+=dt;R.rings=R.rings.filter(r=>r.t<r.life);
 for(const bo of R.bolts)bo.t+=dt;if(R.bolts.length)R.bolts=R.bolts.filter(bo=>bo.t<bo.life);
 for(const k in R.fx){const f=R.fx[k];if(f.t>0)f.t-=dt;}

 if(R.intro>0){R.intro-=dt;if(R.intro<=0){shake(4,0,1);sfx.thud();puff(R.ball.x,R.ball.y+10);}}}
function endWave(){R.phase='gatewait';R.gateT=0.6;R.fires.length=0;for(const e of R.enemies)if(!e.dead)burst(e.x,e.y,colOf(e.ec==='t'?'w':e.ec),6);R.enemies.length=0;R.pending.length=0;R.minis.length=0;R.pickups.length=0;R.dq.length=0;R.fx={};R.tilt=null;R.twin.b=null;R.shots.length=0;R.marks.length=0;R.ball.leech=null;R.forceEc=null;
 if(R.wv&&R.wv.k==='first2'&&!R.practice&&!META.tut){META.tut=true;save();}
 R.clearTitle=(loopRoom()||(R.wv&&R.wv.k==='test')?'':'WAVE '+R.wave+' ')+'CLEAR';pop(R.clearTitle,180,200,'#fff',30,1.0);sfx.clear();shake(3,0,0);vib(1,'ok');}
function step(dt){R.gt+=dt;const TS=fxOn('TimeStop');
 if(R.phase==='wave'&&!TS)waveSpawn(dt);
 if(!TS){pendingStep(dt);blocksStep(dt);}
 ballStep(dt);twinStep(dt);kegsStep(dt);minisStep(dt);enemiesStep(dt);firesStep(dt);dominoStep(dt);boomsStep(dt);shotsStep(dt);marksStep(dt);groundStep(dt);puTick(dt);bossStep(dt);stompsStep(dt);fxStep(dt);
 if(R.hintT>0)R.hintT-=dt;
 if(R.trick&&R.phase==='wave')trickStep();
 if(R.wv&&R.wv.flip&&!R.flipDone&&R.phase==='wave'&&R.kills>=Math.ceil(R.total/2))doFlip();
 if(R.phase==='wave'&&waveDone())endWave();
 if(R.phase==='gatewait'){R.gateT-=dt;if(R.gateT<=0){if(loopRoom())advance();else openGate();}}
 // a level-up mid-fight is saved for the screen after the wave (in the boss fight, the last stage, it only scores)
 while(R.score>=R.nextLvl){R.level++;R.nextLvl=lvlNeed(R.level);sfx.bell(false);if(R.inBoss||loopRoom())pop('LEVEL '+R.level+'!',180,R.inBoss?112:60,'#ffd23f',18,1.2);else{R.lvlDue++;pop('LEVEL '+R.level+'! +1 PICK AFTER THE WAVE',180,60,'#ffd23f',14,1.6);}}}
function decayFx(rdt){const s=R.shake;if(s.t>0)s.t-=rdt;if(R.flash>0)R.flash-=rdt;for(let i=0;i<4;i++)if(R.wflash[i]>0)R.wflash[i]-=rdt;const b=R.ball;if(b.punch>0)b.punch-=rdt;if(b.chainPop>0)b.chainPop-=rdt;if(b.hot)b.coldT=0;else b.coldT+=rdt;}

// ================= gates =================
function famCount(f){let n=0;for(const k in R.upg)if(famOf(k)===f)n++;return n;}
// a card can be offered unless it is maxed or banished, or it is a new terrain / power-up kind and you already have 3
function canOffer(k){const l=R.upg[k]||0;if(l>=3||R.banned.includes(k)||!cardOn(k))return false;const f=famOf(k);return !!(l||!CAP[f]||famCount(f)<CAP[f]);}
// any three cards. From the 2nd pick on, one card is often one that switches on a combo.
function makeOffer(exclude){const avail=CARD_KEYS.filter(k=>canOffer(k)&&!exclude.includes(k));
 for(let i=avail.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[avail[i],avail[j]]=[avail[j],avail[i]];}
 const pick=[];if(R.locked&&avail.includes(R.locked))pick.push(R.locked);
 const cmb=avail.filter(k=>combosFor(k).length&&!pick.includes(k));if(R.picks>=1&&cmb.length&&rnd()<0.6)pick.push(cmb[0]);
 for(const k of avail){if(pick.length>=3)break;if(!pick.includes(k))pick.push(k);}
 return pick.sort((a,b)=>FAM_ORDER[famOf(a)]-FAM_ORDER[famOf(b)]);}
// the one screen between waves. Picks owed = 1 + level-ups + rewards (Golden, trick shot). Each pick is a card or healing; the cards refresh in place.
// taps on the screen are ignored for GATE_GUARD s after it opens, so a tap meant for aiming cannot pick a card unread
const GATE_GUARD=0.8;
function openGate(){R.gateKind='wave';scr='gate';scrT=0;gateAnim=0;R.gateN++;P.aim=false;buffered=null;
 R.picksOwed=1+R.lvlDue+R.freeDue;R.pickN=0;R.gateLvl=R.lvlDue;R.lvlDue=0;R.freeDue=0;
 const t=lvR('tools');if(t>=1)R.reroll=Math.max(R.reroll,1);R.banishes=t>=2?1:0;R.locks=t>=3?1:0;R.gateMode=null;R.lockedShown=R.locked;reseed(300+R.gateN*10);R.offer=makeOffer([]);R.locked=null;R.sel=null;saveRun('gate');}
// one pick used: refresh the cards (with a short guard so a double tap does not pick blind), or go on when none are left
function usePick(){R.picksOwed--;R.pickN++;R.sel=null;if(R.picksOwed>0){reseed(300+R.gateN*10+R.pickN);R.offer=makeOffer([]);R.lockedShown=null;R.gateMode=null;gateAnim=0.1;scrT=Math.min(scrT,GATE_GUARD-0.35);saveRun('gate');return;}R.rewards=[];nextStage();}
function doReroll(){if(!R.reroll)return;R.reroll--;R.sel=null;R.offer=makeOffer(R.offer);saveRun('gate');R.lockedShown=null;gateAnim=0;sfx.pick();}
function setGateMode(m){if(m==='banish'&&!R.banishes)return;if(m==='lock'&&!R.locks)return;R.sel=null;R.gateMode=R.gateMode===m?null:m;sfx.click(2);}
function pickCard(i){const nm=R.offer[i];if(!nm)return;
 if(R.gateMode==='banish'){R.banishes--;R.gateMode=null;R.banned.push(nm);const alt=makeOffer(R.offer).find(k=>!R.offer.includes(k));if(alt)R.offer[i]=alt;else R.offer.splice(i,1);if(R.lockedShown===nm)R.lockedShown=null;sfx.cancel();vib(10);return;}
 if(R.gateMode==='lock'){R.locks--;R.gateMode=null;R.locked=nm;R.lockedShown=nm;sfx.click(3);vib(10);return;}
 const cbs=combosFor(nm),was=R.upg[nm]||0,lvl=was+1;R.upg[nm]=lvl;R.picks++;recalc();
 if(nm==='Shield')R.ball.shield=C.shieldMax;
 if(famOf(nm)==='POWER'&&!was)R.pu[nm].t=2.5;
 sfx.pick();vib(10);
 if(cbs.length){pop('COMBO: '+cbs.map(c=>c.name).join(' + '),180,246,'#ffd23f',cbs.length>1?18:26,2.2);popWrap(cbs[0].d,180,278,'#fff3c0',14,2.4);sfx.bell(true);}
 usePick();}
// HEAL uses a pick: +2 hearts, or +1 max heart when full. At heat 4+ there is no healing: the button skips the pick.
const healCap=()=>7+lvR('hearts'),canHeal=()=>R.heat>=4||R.hearts<R.maxH||R.maxH<healCap();
function patchUp(){if(scr!=='gate')return;if(!canHeal()){if(!R.offer.length){sfx.click(1);usePick();return;}sfx.cancel();return;}if(R.heat>=4){sfx.click(1);usePick();return;}if(R.hearts<R.maxH)R.hearts=Math.min(R.maxH,R.hearts+2);else{R.maxH++;R.hearts=R.maxH;}sfx.pick();vib(10);usePick();}
function nextStage(){scr='play';scrT=0;paused=false;saveRun('wave');advance();}
// a tap on the card screen: the first tap on a card (or HEAL) chooses it, a second tap on the same one takes it.
// Banish and lock act on the first tap. Keys 1-4 still take a card at once.
function gateTap(i){if(i<3&&R.gateMode){pickCard(i);return;}
 if(i===3&&!canHeal()&&R.offer.length){sfx.cancel();return;}
 if(R.sel===i){R.sel=null;if(i===3)patchUp();else pickCard(i);return;}
 R.sel=i;sfx.click(2);vib(6);}
// rank: time against par (about 22 s a wave and 50 s a boss) and best chain
function rankOf(time,chain,cleared,atBoss){if(!cleared)return atBoss?'D':'E';const nw=totalWaves(),nb=R.plan.filter(s=>s.k==='boss').length,par=22*nw+50*nb;
 const tg=time<=par?0:time<=par*1.2?1:time<=par*1.5?2:3,cg=chain>=10?0:chain>=8?1:chain>=6?2:3;return 'SABC'[Math.max(tg,cg)];}
// rank uses game time (R.gt: simulated seconds; slow-mo, hit-stop and pause do not count). Practice runs give no XP and set no bests.
function finishRun(){const dead=R.phase==='dead';if(dead)R.clearTime=R.gt;R.nb={};
 R.rank=rankOf(R.clearTime,R.bestChain,!dead,R.inBoss);
 if(R.practice){R.xpGain=0;}
 else{BEST.runs++;
  if(!dead&&(BEST.time===0||R.clearTime<BEST.time)){R.nb.time=true;BEST.time=R.clearTime;}if(R.bestChain>BEST.chain){R.nb.chain=true;BEST.chain=R.bestChain;}if(R.score>BEST.score){R.nb.score=true;BEST.score=R.score;}
  R.xpGain=Math.round(R.score/10*heatMult(R.heat))+(dead?0:50);META.xp+=R.xpGain;META.earned+=R.xpGain;META.runs++;
  if(R.daily){const t=todayKey();if(R.daily.day===t){const d=META.daily&&META.daily.day===t?META.daily:{day:t,best:0,tries:0};d.tries++;if(R.score>d.best){d.best=R.score;R.nb.daily=true;}META.daily=d;}}
  const bk=R.plan.find(s=>s.k==='boss');if(bk&&!R.daily)META.lastBoss=bk.key;
  if(!dead&&!R.daily&&R.heat===META.heatMax&&META.heatMax<HEAT_MAX){META.heatMax++;R.newHeat=true;}
  if(!R.daily&&META.cardsN<CARD_UNLOCK.length){R.newCard=CARD_UNLOCK[META.cardsN];META.cardsN++;}
  if(!R.daily&&(R.inBoss||!dead))META.newOk=true;
  clearRun();}
 save();scr=dead?'over':'clear';scrT=0;P.aim=false;buffered=null;R.pops.length=0;}
// practice screen: tap a card to raise its level; a 4th tap takes it off. The caps hold here too.
function labTap(k){const l=LAB[k]||0;if(!l&&!labRoom(k)){labMsg='You can have 3 '+(famOf(k)==='POWER'?'power-ups':'terrain kinds')+'. Tap one to take it off first.';labMsgT=2.6;sfx.cancel();return;}
 if(l>=3)delete LAB[k];else LAB[k]=l+1;save();sfx.click(LAB[k]||0);}

// ================= update =================
// aim slow motion lasts as long as you hold the pull, in every run (the workshop makes it slower, not longer)
const slowFree=()=>true;
let lastT=(typeof performance!=='undefined'?performance.now():0);
function update(rdt){scrT+=rdt;if(labMsgT>0)labMsgT-=rdt;
 if(scr==='title'){const tb=titleBall;wallStep(tb,rdt,1,0,null);tb.trail.push({x:tb.x,y:tb.y});if(tb.trail.length>14)tb.trail.shift();return;}
 if(scr==='gate'){gateAnim+=rdt;return;}
 if(scr!=='play'||!R||paused)return;
 if(R.freeze>0){R.freeze-=rdt;decayFx(rdt);return;}
 let ts=1;if(P.aim){P.hold+=rdt;ts=P.hold<C.slowT||slowFree()?C.slowK:Math.min(1,C.slowK+(1-C.slowK)*(P.hold-C.slowT)/0.5);}
 if(R.slowT>0){R.slowT-=rdt;ts*=0.3;}
 if(R.phase==='dead')ts=0.3;if(R.phase==='bossdead')ts=0.15;R.ts=ts;
 R.acc=Math.min(0.1,R.acc+rdt*ts);
 while(R.acc>=STEP){R.acc-=STEP;step(STEP);if(R.freeze>0||scr!=='play')break;}
 decayFx(rdt);
 if(R.phase==='dead'||R.phase==='bossdead'){R.endT-=rdt;if(R.endT<=0){if(R.phase==='bossdead')afterBoss();else finishRun();}}}

// ================= drawing helpers =================
// nothing on any screen is drawn under MIN_TXT px
const MIN_TXT=11;
function txt(s,x,y,size,col,align,weight){size=Math.max(MIN_TXT,size);ctx.font=(weight||600)+' '+size+'px '+FONT;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y);}
// txt, shrunk until it fits in maxW
function fitTxt(s,x,y,maxW,size,col,align,weight){let sz=size;ctx.font=(weight||600)+' '+sz+'px '+FONT;while(sz>MIN_TXT&&ctx.measureText(s).width>maxW){sz-=0.5;ctx.font=(weight||600)+' '+sz+'px '+FONT;}txt(s,x,y,sz,col,align,weight);}
function rrect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();}
function wrap(s,maxW,size){ctx.font='500 '+size+'px '+FONT;const words=s.split(' '),lines=[];let cur='';for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}if(cur)lines.push(cur);return lines;}
function button(x,y,w,h,label,col,fn,size){rrect(x,y,w,h,10);ctx.fillStyle='#1b2030';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=col;ctx.stroke();txt(label,x+w/2,y+h/2,size||16,'#fff','center',700);UI.push({x,y,w,h,fn});}
function circ(x,y,r,fill,stroke,lw){ctx.beginPath();ctx.arc(x,y,r,0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.lineWidth=lw||2;ctx.strokeStyle=stroke;ctx.stroke();}}
